symbolPreset: unicode
composer:
  shape: band
theme:
  dark: titanium
  light: light
setupVersion: 2
modelRoles:
  smol: google-antigravity/gemini-3.8-flash
  tiny: google-antigravity/gemini-3.8-flash
  memory: google-antigravity/gemini-3.8-flash
  commit: google-antigravity/gemini-3.8-flash
  judge: openai-codex/gpt-6-luna:medium
  task: openai-codex/gpt-6-luna:high
  vision: google-antigravity/gemini-3.8-flash:medium
  plan: openai-codex/gpt-6.1-sol:xhigh
  slow: openai-codex/gpt-6.1-sol:xhigh
  advisor: xai-oauth/grok-4.7:high
  image: google-antigravity/gemini-3.1-flash-image
  web: web/exa
  default: deepseek/deepseek-flash
cycleOrder:
  - smol
  - default
  - slow
task:
  agentModelOverrides:
    scout: "@smol"
    sonic: "@smol"
    task: "@task:high"
    reviewer: "@slow:xhigh"
    security-reviewer: "@slow:xhigh"
  maxConcurrency: 1
  maxRecursionDepth: 1
  softRequestBudget: 25
  enableEffort: false
  showResolvedModelBadge: true
dev:
  autoqaConsent: granted
startup:
  quiet: false
  checkUpdate: false
  showSplash: false
defaultThinkingLevel: xhigh
enabledModels:
  - google-antigravity/gemini-3.8-flash
  - openai-codex/gpt-6.1-sol
  - openai-codex/gpt-6-luna
  - openai-codex/gpt-6-astra
  - xai-oauth/grok-4.7:high
  - xai-oauth/grok-4.7:xhigh
  - deepseek/*
modelProviderOrder:
  - google-antigravity
  - openai-codex
  - cursor
  - xai-oauth
  - xai
  - deepseek
retry:
  usageAwareFallback: true
  modelFallback: true
  maxRetries: 2
  fallbackOn: usage-limit
  fallbackChains:
    plan:
      - google-antigravity/gemini-3.8-flash
      - xai-oauth/grok-4.7:xhigh
    slow:
      - google-antigravity/gemini-3.8-flash
      - xai-oauth/grok-4.7:high
    advisor:
      - google-antigravity/gemini-3.8-flash
      - openai-codex/gpt-6.1-sol:high
    task:
      - google-antigravity/gemini-3.8-flash
      - xai-oauth/grok-4.7:high
    judge:
      - google-antigravity/gemini-3.8-flash
      - xai-oauth/grok-4.7:medium
    default:
      - google-antigravity/gemini-3.8-flash
      - openai-codex/gpt-6.1-sol:medium
    smol:
      - xai-oauth/grok-4.7:medium
    tiny:
      - xai-oauth/grok-4.7:medium
    memory:
      - xai-oauth/grok-4.7:medium
    commit:
      - xai-oauth/grok-4.7:medium
    vision:
      - xai-oauth/grok-4.7:medium
    image:
      - xai-oauth/grok-imagine-image
    openai-codex/gpt-6.1-sol:
      - google-antigravity/gemini-3.8-flash
      - xai-oauth/grok-4.7:high
    openai-codex/gpt-6-astra:
      - google-antigravity/gemini-3.8-flash
      - xai-oauth/grok-4.7:high
skills:
  customDirectories:
    - ~/.omp/agent/skills
  enableAgentsProject: false
  enableAgentsUser: false
  enableClaudeProject: false
  enableClaudeUser: false
  enableCodexUser: false
  enablePiProject: false
  enablePiUser: false
extensions: []
disabledExtensions:
  - extension-module:opencode-free
disabledProviders: []
commands:
  enableOpencodeProject: false
  enableOpencodeUser: false
memory:
  backend: local
memories:
  maxRolloutsPerStartup: 8
browser:
  headless: false
hideThinkingBlock: false
codexResets:
  autoRedeem: "no"
recap:
  enabled: false
providers:
  cacheWarming: "off"
advisor:
  enabled: true