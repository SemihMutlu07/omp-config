symbolPreset: unicode
composer:
  shape: band
theme:
  dark: titanium
  light: light
statusLine:
  preset: custom
  leftSegments:
    - model
    - mode
    - path
    - git
    - pr
  rightSegments:
    - usage
    - cost
    - context_pct
  separator: pipe
  transparent: true
display:
  showTurnTime: true
  subagentLivePreview: true
extensionRenderers:
  transcriptPresenters: true
tui:
  colorfulMarkdown: false
  motion: reduced
error:
  notify: "on"
setupVersion: 3
modelRoles:
  smol: xai-oauth/grok-4.7
  tiny: xai-oauth/grok-4.7
  memory: xai-oauth/grok-4.7
  commit: xai-oauth/grok-4.7
  judge: deepseek/deepseek-v4-flash
  task: xai-oauth/grok-4.6:high
  vision: anthropic/claude-sonnet-5-5
  plan: openai-codex/gpt-6.1-sol:xhigh
  slow: openai-codex/gpt-6.1-sol:high
  advisor: openai-codex/gpt-6.1-sol:medium
  web: web/exa
  default: deepseek/deepseek-v4-flash
cycleOrder:
  - smol
  - default
task:
  agentModelOverrides:
    scout: xai-oauth/grok-4.6:high
    sonic: xai-oauth/grok-4.7
    task: xai-oauth/grok-4.6:high
    reviewer: "@slow"
    security-reviewer: "@slow"
  maxConcurrency: 6
  perCallModel: true
  maxRecursionDepth: 1
  softRequestBudget: 25
  enableEffort: true
  showResolvedModelBadge: true
  maxEffort: max
dev:
  autoqaConsent: granted
startup:
  quiet: false
  checkUpdate: false
  showSplash: false
defaultThinkingLevel: xhigh
enabledModels:
  - xai-oauth/grok-4.7
  - xai-oauth/grok-4.6
  - openai-codex/gpt-6.1-sol
  - openai-codex/gpt-6-astra
  - openai-codex/gpt-6-luna
  - anthropic/claude-sonnet-5-5
  - anthropic/claude-opus-5-5
  - anthropic/claude-fable-5-2
  - deepseek/deepseek-v4-flash
  - deepseek/deepseek-v4-pro
  - deepseek/deepseek-flash
modelProviderOrder:
  - openai-codex
  - anthropic
  - xai-oauth
  - xai
  - deepseek
retry:
  usageAwareFallback: false
  modelFallback: false
  maxRetries: 2
  fallbackOn: usage-limit
  fallbackChains:
    plan:
      - openai-codex/gpt-6.1-sol:xhigh
      - xai-oauth/grok-4.6:high
    slow:
      - openai-codex/gpt-6.1-sol:high
      - xai-oauth/grok-4.6:high
      - deepseek/deepseek-v4-flash:high
    advisor:
      - xai-oauth/grok-4.7
    task:
      - xai-oauth/grok-4.6:high
      - deepseek/deepseek-v4-flash:high
    judge:
      - xai-oauth/grok-4.7
    default:
      - xai-oauth/grok-4.7
    smol:
      - deepseek/deepseek-v4-flash
    tiny:
      - deepseek/deepseek-v4-flash
    memory:
      - deepseek/deepseek-v4-flash
    commit:
      - deepseek/deepseek-v4-flash
    vision:
      - xai-oauth/grok-4.7
  waitForUsageReset: true
skills:
  customDirectories: []
  enableAgentsProject: false
  enableAgentsUser: true
  enableClaudeProject: false
  enableClaudeUser: false
  enableCodexUser: false
  enablePiProject: false
  enablePiUser: false
extensions: []
disabledExtensions:
  - extension-module:opencode-free
disabledProviders: []
commands:
  enableOpencodeProject: false
  enableOpencodeUser: false
memory:
  backend: "off"
memories:
  maxRolloutsPerStartup: 8
  enabled: false
browser:
  headless: false
hideThinkingBlock: true
codexResets:
  autoRedeem: "no"
recap:
  enabled: false
providers:
  cacheWarming: "off"
advisor:
  enabled: true
  continueSeverity: blocker
  reviewMode: agent-end
  reviewInterval: 3
prewalk:
  enabled: false
  from: "@plan"
  into: "@smol"
  auto: suggest
  autoTarget: "@smol"
session:
  warnCost: 10
compaction:
  thresholdTokens: 150000
  modelThresholds:
    xai-oauth/*: f150000
    xai-oauth/grok-4.7: f150000
    anthropic/*: f150000
    anthropic/claude-opus-5-5: f120000
    anthropic/claude-sonnet-5-5: f150000
    anthropic/claude-haiku-5-5: f90000
    openai-codex/*: f150000
update:
  auto: true
tools:
  outputMaxColumns: 16384
