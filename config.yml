symbolPreset: unicode
composer:
  shape: band
theme:
  dark: titanium
  light: light
setupVersion: 2
modelRoles:
  smol: google-antigravity/gemini-3.8-flash
  tiny: google-antigravity/gemini-3.8-flash
  memory: google-antigravity/gemini-3.8-flash
  commit: google-antigravity/gemini-3.8-flash
  judge: google-antigravity/gemini-3.8-flash
  task: google-antigravity/gemini-3.8-flash:high
  vision: google-antigravity/gemini-3.8-flash:medium
  plan: anthropic/claude-sonnet-5-5:xhigh
  slow: anthropic/claude-sonnet-5-5:xhigh
  advisor: anthropic/claude-sonnet-5-5:medium
  image: google-antigravity/gemini-3.1-flash-image
  web: web/exa
  default: google-antigravity/gemini-3.8-flash
cycleOrder:
  - smol
  - default
  - slow
task:
  agentModelOverrides:
    scout: google-antigravity/gemini-3.8-flash:max
    sonic: google-antigravity/gemini-3.8-flash:max
    task: google-antigravity/gemini-3.8-flash:max
    reviewer: google-antigravity/gemini-3.8-flash:max
    security-reviewer: google-antigravity/gemini-3.8-flash:max
  maxConcurrency: 6
  maxRecursionDepth: 1
  softRequestBudget: 25
  enableEffort: true
  showResolvedModelBadge: true
  maxEffort: max
dev:
  autoqaConsent: granted
startup:
  quiet: false
  checkUpdate: false
  showSplash: false
defaultThinkingLevel: xhigh
enabledModels:
  - google-antigravity/gemini-3.8-flash
  - xai-oauth/grok-4.7
  - anthropic/claude-haiku-5-5
  - anthropic/claude-sonnet-5-5
  - anthropic/claude-opus-5-5
modelProviderOrder:
  - google-antigravity
  - anthropic
  - xai-oauth
  - xai
retry:
  usageAwareFallback: true
  modelFallback: true
  maxRetries: 2
  fallbackOn: usage-limit
  fallbackChains:
    plan:
      - xai-oauth/grok-4.7
    slow:
      - xai-oauth/grok-4.7
    advisor:
      - google-antigravity/gemini-3.8-flash:medium
      - xai-oauth/grok-4.7
    task:
      - xai-oauth/grok-4.7
    judge:
      - xai-oauth/grok-4.7
    default:
      - google-antigravity/gemini-3.8-flash:medium
      - xai-oauth/grok-4.7
    smol:
      - xai-oauth/grok-4.7
    tiny:
      - xai-oauth/grok-4.7
    memory:
      - xai-oauth/grok-4.7
    commit:
      - xai-oauth/grok-4.7
    vision:
      - xai-oauth/grok-4.7
    image: []
skills:
  customDirectories: []
  enableAgentsProject: false
  enableAgentsUser: true
  enableClaudeProject: false
  enableClaudeUser: false
  enableCodexUser: false
  enablePiProject: false
  enablePiUser: false
extensions: []
disabledExtensions:
  - extension-module:opencode-free
disabledProviders:
  - deepseek
commands:
  enableOpencodeProject: false
  enableOpencodeUser: false
memory:
  backend: local
memories:
  maxRolloutsPerStartup: 8
browser:
  headless: false
hideThinkingBlock: true
codexResets:
  autoRedeem: "no"
recap:
  enabled: false
providers:
  cacheWarming: "off"
advisor:
  enabled: true
  continueSeverity: blocker
  reviewMode: agent-end
  reviewInterval: 3
prewalk:
  enabled: false
  from: "@plan"
  into: "@smol"
  auto: suggest
  autoTarget: "@smol"
compaction:
  thresholdTokens: 150000
  modelThresholds:
    xai-oauth/*: f150000
    xai-oauth/grok-4.7: f150000
    google-antigravity/*: f150000
    google-antigravity/gemini-3.8-flash: f150000
    anthropic/*: f150000