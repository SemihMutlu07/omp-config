symbolPreset: unicode
composer:
  shape: band
theme:
  dark: titanium
  light: light
setupVersion: 2
modelRoles:
  smol: google-antigravity/gemini-3.8-flash
  tiny: google-antigravity/gemini-3.8-flash
  memory: google-antigravity/gemini-3.8-flash
  commit: google-antigravity/gemini-3.8-flash
  judge: openai-codex/gpt-6-luna:medium
  task: openai-codex/gpt-6-luna:high
  vision: google-antigravity/gemini-3.8-flash:medium
  plan: openai-codex/gpt-6.1-sol:xhigh
  slow: openai-codex/gpt-6.1-sol:xhigh
  advisor: openai-codex/gpt-6.1-sol:medium
  image: google-antigravity/gemini-3.1-flash-image
  web: web/exa
  default: deepseek/deepseek-flash
cycleOrder:
  - smol
  - default
  - slow
task:
  agentModelOverrides:
    scout: deepseek/deepseek-flash
    sonic: deepseek/deepseek-v4-flash
    task: "@task"
    reviewer: "@slow"
    security-reviewer: "@slow"
  maxConcurrency: 6
  maxRecursionDepth: 1
  softRequestBudget: 25
  enableEffort: false
  showResolvedModelBadge: true
dev:
  autoqaConsent: granted
startup:
  quiet: false
  checkUpdate: false
  showSplash: false
defaultThinkingLevel: xhigh
enabledModels:
  - google-antigravity/gemini-3.8-flash
  - openai-codex/gpt-6.1-sol
  - openai-codex/gpt-6-luna
  - openai-codex/gpt-6-astra
  - xai-oauth/grok-4.7
  - deepseek/*
modelProviderOrder:
  - google-antigravity
  - openai-codex
  - xai-oauth
  - xai
  - deepseek
retry:
  usageAwareFallback: true
  modelFallback: true
  maxRetries: 2
  fallbackOn: usage-limit
  fallbackChains:
    plan:
      - deepseek/deepseek-v4-pro
    slow:
      - deepseek/deepseek-v4-pro
    advisor:
      - deepseek/deepseek-v4-pro
    task:
      - deepseek/deepseek-v4-pro
    judge:
      - deepseek/deepseek-v4-pro
    default:
      - openai-codex/gpt-6.1-sol:medium
    smol:
      - deepseek/deepseek-flash
    tiny:
      - deepseek/deepseek-flash
    memory:
      - deepseek/deepseek-flash
    commit:
      - deepseek/deepseek-flash
    vision:
      - deepseek/deepseek-v4-flash-vision-exp
    image: []
skills:
  customDirectories: []
  enableAgentsProject: false
  enableAgentsUser: true
  enableClaudeProject: false
  enableClaudeUser: false
  enableCodexUser: false
  enablePiProject: false
  enablePiUser: false
extensions: []
disabledExtensions:
  - extension-module:opencode-free
disabledProviders: []
commands:
  enableOpencodeProject: false
  enableOpencodeUser: false
memory:
  backend: local
memories:
  maxRolloutsPerStartup: 8
browser:
  headless: false
hideThinkingBlock: false
codexResets:
  autoRedeem: "no"
recap:
  enabled: false
providers:
  cacheWarming: "off"
advisor:
  enabled: true
  continueSeverity: blocker
  reviewMode: agent-end
  reviewInterval: 3
compaction:
  modelThresholds:
    xai-oauth/grok-4.20-0309-non-reasoning: f150000
    xai-oauth/grok-4.20-0309-reasoning: f150000
    xai-oauth/grok-4.20-multi-agent-0309: f150000
    xai-oauth/grok-4.3: f150000
    xai-oauth/grok-4.5: f150000
    xai-oauth/grok-4.6: f150000
    xai-oauth/grok-4.7: f150000
    xai-oauth/grok-build: f150000
    xai-oauth/grok-build-0.1: f150000