# User-scope advisor roster (symlinked to ~/.omp/agent/WATCHDOG.yml).
# A project-level WATCHDOG.yml overrides this file for that directory. Do not
# leave one in a working directory: a stray /tmp/WATCHDOG.yml once forced
# astra:high on every session started from /tmp.
#
# Cost rule: advisor runs on the xAI quota (grok-4.7:high), separate from the
# Codex plan the planner/slow roles share, and reviews once per completed
# agent response (agent-end), not on every turn.

instructions: |
  Call the advise tool only when you have a material finding. An empty final
  answer never reaches the primary: put the finding in the tool call itself.
  Flag: a "done" claim with no file or command, a Kasa or session id that grep
  misses, a skipped user constraint, and any yield before the requested
  evidence exists. Prefer one high-signal note over several low-value ones.
  Do not restate the primary's plan and do not act as a second implementer.

advisors:
  - name: default
    model: xai-oauth/grok-4.7:high
    reviewMode: agent-end
    instructions: |
      You are the vision and planning reviewer.
      Check the turn against the task card: outcome, scope fence, acceptance
      check. If the primary claims completion, demand the command output and
      the committed file. If the primary is planning instead of executing,
      say which single next command unblocks it.
